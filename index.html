<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Andre360</title>
  <meta name="description" content="Projeto 360 dias rumo aos 60: treino e dieta viram tênis novo.">
  <meta name="theme-color" content="#0A0B0D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Andre360">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,800;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="tabs" hidden>
      <button data-tab="hoje"><svg viewBox="0 0 24 24"><path d="M3 17c0-3 1-6 3-8l2 1c1 1 2 1 3 1h2c3 0 6 2 8 4v2H3z"/><path d="M3 20h18"/></svg><span>Hoje</span></button>
      <button data-tab="semanas"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4m8-4v4"/></svg><span>Semanas</span></button>
      <button data-tab="tenis"><svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M9 8V6a3 3 0 0 1 6 0v2M12 12v4"/></svg><span>Cofre</span></button>
      <button data-tab="conquistas"><svg viewBox="0 0 24 24"><circle cx="12" cy="15" r="6"/><path d="M8.5 10 6 3h4l2 4 2-4h4l-2.5 7"/></svg><span>Conquistas</span></button>
      <button data-tab="ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h4m4 0h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Ajustes</span></button>
    </nav>
  </div>
  <div id="sheet-root"></div>
  <canvas id="fx" aria-hidden="true"></canvas>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Ative o JavaScript para usar o Andre360.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
